<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Sky Trail 3D - GameForgeJS</title>
		<style>
			html,
			body {
				margin: 0;
				min-height: 100%;
				background: #111827;
				color: #f8fafc;
				font-family: system-ui, sans-serif
			}

			canvas {
				display: block;
				--canvas-ratio: 1.5;
				position: fixed !important;
				inset: auto !important;
				left: 50% !important;
				top: 50% !important;
				transform: translate(-50%, -50%);
				width: min(100vw, calc(100vh * var(--canvas-ratio))) !important;
				height: min(100vh, calc(100vw / var(--canvas-ratio))) !important
			}

			canvas[width="960"] {
				--canvas-ratio: 1.7777777778
			}


		</style>
		<script type="importmap">
			{
				"imports": {
					"gameforgejs/2d": "../../src/2d/index.js",
					"gameforgejs/3d": "../../src/3d/index.js",
					"gameforgejs/compat": "../../src/compat/index.js",
					"gameforgejs/core": "../../src/core/index.js",
					"gameforgejs/network": "../../src/network/index.js"
				}
			}
		</script>
	</head>
	<body>
		<script type="module" src="./main.js"></script>
	</body>
</html>
