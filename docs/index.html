<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="GameForgeJS guides, API reference, and project documentation.">
  <title>GameForgeJS documentation</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app">Loading GameForgeJS documentation...</div>
  <script>
    window.$docsify = {
      name: 'GameForgeJS',
      repo: 'https://github.com/Drakopit/GameForgeJS',
      homepage: 'index.md',
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
      },
      subMaxLevel: 2,
      sidebarDisplayLevel: 1,
      search: {
        paths: 'auto',
        placeholder: 'Search documentation',
        noData: 'No results found',
        depth: 4,
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
