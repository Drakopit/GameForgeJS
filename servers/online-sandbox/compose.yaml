services:
  game:
    build:
      context: ../..
      dockerfile: servers/online-sandbox/Dockerfile
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000;http://127.0.0.1:3000;https://drakopit.github.io}
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 256m
    cpus: 1
  proxy:
    image: caddy:2-alpine
    profiles: [public]
    restart: unless-stopped
    depends_on: [game]
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
volumes:
  certificates:
  proxy_config:
